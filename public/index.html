<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Cave Oops!</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ffc83d' stroke='%23221a31' stroke-width='3'/%3E%3Ccircle cx='11' cy='13' r='2'/%3E%3Ccircle cx='21' cy='13' r='2'/%3E%3Cpath d='M9 23q7-8 14 0' fill='none' stroke='%23221a31' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="shell">
    <canvas id="game" width="1280" height="720" aria-label="Cave Oops platform game"></canvas>
    <section id="title" class="screen">
      <div class="logo"><b>CAVE</b><em>OOPS!</em></div>
      <p>Deliver one backpack. Survive five extremely rude caves.</p>
      <button id="play" disabled>LOADING TROUBLE…</button>
      <div class="load"><i id="loadfill"></i></div>
      <small>MOVE: WASD / LEFT STICK &nbsp; • &nbsp; JUMP: SPACE / ✕ &nbsp; • &nbsp; DASH: SHIFT / □</small>
      <small id="padstatus">PS5 CONTROLLER: CONNECT IT, THEN PRESS ANY BUTTON</small>
    </section>
    <section id="pause" class="screen hidden"><h2>PAUSED IN MID-OOPS</h2><button data-do="resume">KEEP FALLING</button><button data-do="restart">RESTART STAGE</button><button data-do="title">TITLE SCREEN</button></section>
  </main>
  <script src="game.js?v=0.2.4"></script>
</body>
</html>
